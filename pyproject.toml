[project]
name = "roosterly-triage"
version = "0.1.0"
description = "Support-ticket triage agent for Roosterly's Dutch-language helpdesk (Nordavo take-home)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["httpx (>=0.28.1,<0.29.0)", "pydantic (>=2.14.3,<3.0.0)", "pydantic-settings (>=2.16.3,<3.0.0)", "asyncpg (>=0.32.0,<0.33.0)", "python-stdnum (>=2.2,<3.0)", "lingua-language-detector (>=2.2.0,<3.0.0)", "fast-langdetect (>=1.2.0,<2.0.0)"]

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.5.0,<2.0.0)",
    "hypothesis (>=6.155.7,<6.156.0)",
    "ruff (>=0.17.5,<0.18.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "asyncpg-stubs (>=0.32.0,<0.33.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "triage", from = "src" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PIE", "PT", "PERF",
    "ASYNC", "S", "TID", "RUF",
]
ignore = ["S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]
"scripts/**" = ["S603"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
