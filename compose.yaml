services:
  db:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage
      POSTGRES_DB: triage
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - triage-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d triage"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  triage-db:
